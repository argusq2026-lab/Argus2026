name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run tests
        run: pytest tests/ -q --timeout=300

      - name: Smoke-run the ingest server end to end (no phone needed)
        shell: bash
        run: |
          python -m argus.cli demo --out demo/ci_fixture.json --ticks 40
          python -m argus.cli run --ws-port 18765 --json-log out/ci.jsonl --max-ticks 30 --quiet &
          run_pid=$!
          sleep 1
          python demo/replay_client.py --fixture demo/ci_fixture.json --ws-port 18765
          wait "$run_pid"
          python -m argus.cli doctor --ws-port 18765

      - name: Assert the run produced a ranked, redacted log
        shell: python
        run: |
          import json, sys
          lines = [json.loads(x) for x in open("out/ci.jsonl", encoding="utf-8") if x.strip()]
          assert len(lines) == 30, f"expected 30 ticks, got {len(lines)}"
          ranked = [line for line in lines if line["records"]]
          assert ranked, "no trainee was ever ranked"
          for line in lines:
              for record in line["records"]:
                  assert set(record) == {"trainee_id", "score", "reason_codes", "ts"}, record
          scores = [r["score"] for r in ranked[-1]["records"]]
          assert scores == sorted(scores, reverse=True), scores
          print(f"ok: {len(lines)} ticks, {len(ranked[-1]['records'])} trainees ranked")

  determinism:
    name: byte-identical rank
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      # The product claim is that the rank is reproducible. This is the
      # dedicated, always-required check for it.
      - run: pytest tests/test_determinism.py -v

  privacy:
    name: alert boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      # Run the structural privacy tests as their own required job, so a change
      # that widens the boundary cannot be lost in a long test log.
      - run: pytest tests/test_privacy.py -v

  lint:
    name: import hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      # Importing the scorer must not drag in a model runtime or a transport
      # library: the pure-function core is meant to be usable, and auditable,
      # on its own, with no network or image dependency at all.
      - name: triage.py imports standalone
        shell: python
        run: |
          import sys
          import argus.triage  # noqa: F401
          heavy = {"websockets", "onnxruntime", "cv2", "onnx", "numpy"} & set(sys.modules)
          assert not heavy, f"argus.triage pulled in {heavy}"
          print("ok: the scorer imports with no model runtime or transport library")
