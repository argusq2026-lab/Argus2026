[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "argus"
version = "0.1.0"
description = "Argus — many eyes, one mind. Deterministic, explainable multi-phone trainee triage over a WebSocket ingest server."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "QUAD Contributors" }]
keywords = ["websocket", "triage", "pose", "fitness", "hiit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# The core install is deliberately small: the scorer is pure stdlib, and the
# only runtime dependency is the WebSocket ingest server itself. There is no
# model runtime here at all -- pose and form/exercise classification run on
# each trainee's phone; see docs/PROTOCOL.md.
dependencies = [
    "websockets>=13",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-timeout>=2.1",
]
# Build-time only: freezing the laptop side into a standalone executable, so a
# trainer's machine needs no Python install. Nothing in src/argus/ imports it,
# and the test suite does not go through the binary.
build = [
    "pyinstaller>=6.0",
]

[project.scripts]
argus = "argus.cli:main"

[project.urls]
Homepage = "https://github.com/argusq2026-lab/Argus2026"

[tool.hatch.build.targets.wheel]
packages = ["src/argus"]

[tool.hatch.build.targets.wheel.force-include]
"configs/argus.default.toml" = "argus/_data/argus.default.toml"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
timeout = 120
filterwarnings = ["error::DeprecationWarning:argus.*"]
