# Argus — default configuration.
#
# This file is the single source of tuning truth. Nothing in src/argus/ may
# hardcode a weight, a threshold, or a network setting: retuning Argus is a
# config edit and a version bump, never a code edit.
#
# `config_version` is checked on load. Bump it whenever a key is renamed,
# removed, or changes meaning, so a stale operator config fails loud instead
# of silently scoring with defaults.
#
# This same file's [scoring.form_error_vocab] is the closed vocabulary a
# phone's on-device form/exercise classifier must draw its `form_reason_codes`
# from -- see docs/PROTOCOL.md. Phone and laptop are expected to deploy from
# copies of the same config.

config_version = 7


# ---------------------------------------------------------------------------
# Deterministic triage scorer (src/argus/triage.py)
#
# The five weights below have NOT been validated against real incidents --
# no labelled trainee-floor footage exists yet. They are the prototype's
# hand-set priors. See docs/VALIDATION.md before trusting the rank
# operationally.
# ---------------------------------------------------------------------------
[scoring]
alert_threshold = 0.5
history_len = 30              # observations kept per trainee (~2 s at ~15 Hz)
keypoint_conf_threshold = 0.3
# bbox_xyxy / keypoints_xy arrive normalized to [0, 1] of the phone's own
# frame (see docs/PROTOCOL.md); 0.003 is "near-zero motion" as a fraction of
# frame size, not a pixel count.
stillness_motion_threshold_frac = 0.003
# Shoulder-line angle that means "facing the station". 180, not 0: COCO and
# MediaPipe label joints from the SUBJECT's perspective, so a camera-facing
# trainee has their left shoulder at the larger image x and the shoulder-line
# angle reads as 180 degrees. Setting this to 0 makes every attentive trainee
# score a full off-task deviation. Override per-station under [[stations]]
# if a future release adds one; today every station shares this reference.
off_task_reference_angle_deg = 180.0

# -- the instructor-facing rolling score ------------------------------------
# The triage score is instantaneous by design: it answers "who needs a human
# right now", and a fall must not be averaged away. That makes it correct and
# almost unreadable -- computed off a ~2 s window, recomputed every
# rank_interval_s, moving constantly. These turn it into a session account an
# instructor can actually watch. Alerts still fire on the instant score; only
# what is displayed and how the calm end of the queue is ordered changes.
rolling_half_life_s = 20.0    # how fast the rolling score forgets
max_frame_gap_s = 1.0         # a longer gap is a reconnect, not work done
# How much work before a fault *rate* is reported at all. One bad rep out of
# one is not a 100% fault rate; it is not yet a rate.
min_reps_for_fault_rate = 3
min_hold_s_for_fault_rate = 10.0

# -- "cannot hold the movement" ---------------------------------------------
# The weighted sum above cannot express sustained form failure. With
# form_error at 0.15, a trainee getting EVERY rep wrong scores 0.15 x 0.8 =
# 0.12 against a 0.5 alert threshold -- no matter how badly or how long they
# struggle, nobody is sent. Raising the weight is not the fix either: enough
# to alert on form would make one bad frame outrank a fall.
#
# So sustained failure is scored on its own terms and joins as a floor: once
# a trainee has been wrong for the majority of a meaningful stretch, they are
# escalated at the severity of the fault they keep making. hips_sagging (0.8)
# summons an instructor; incomplete_lockout (0.4) still does not.
form_persistence_threshold = 0.5      # "the majority of the time"
form_persistence_half_life_s = 45.0   # so corrected form clears in a minute or two
form_persistence_min_s = 20.0         # never fires on a handful of frames

[scoring.weights]
fall = 0.40
stillness = 0.20
occlusion = 0.15
off_task = 0.10
form_error = 0.15

# Closed vocabulary of form/exercise-classifier codes a phone may report in
# `form_reason_codes`. This is authoritative on both ends: the ingest server
# rejects a connection that reports a code outside this set (see
# `argus.ingest.protocol`), which is what keeps the rank reproducible despite
# the phone-side classifier not being auditable from here.
[scoring.form_error_vocab]
"insufficient_depth" = 0.6
"knee_valgus" = 0.8
"rounded_back" = 0.8
"heels_rising" = 0.5
"excessive_forward_lean" = 0.5
"incomplete_lockout" = 0.4
"asymmetric_form" = 0.6
# Plank, from the phone's on-device classifier (android/.../FormClassifier.kt).
# Sagging outranks piking because lumbar hyperextension under load is the
# injury mechanism, where piking is merely an ineffective hold.
"hips_sagging" = 0.8
"hips_piked" = 0.6
# Bicep curl's ML-detected fault (core/bicep_model/README.md calls it "lean
# too far back"): using body momentum instead of the arm, which loads the
# lumbar spine much like rounded_back does, at a lighter typical load -- hence
# below rounded_back/knee_valgus but above the loose-form-only codes above.
"lean_back_error" = 0.7
# Lunge's ML-detected fault, evaluated only at the bottom of a rep (both
# upstream and here -- see [scoring.exercise_weights] and docs/VALIDATION.md
# for the depth gate this implies). Patellofemoral stress from the knee
# tracking past the toe; real but more debated than a valgus collapse, so it
# sits at the same tier as asymmetric_form rather than knee_valgus's.
"knee_over_toe" = 0.6


# Per-exercise weight overrides. A movement can make a feature meaningless or
# actively wrong, and the scorer resolves that by looking up a whole weight
# vector rather than by special-casing exercises in code. A feature weighted 0
# contributes nothing AND emits no reason code. An exercise with no profile
# here scores on [scoring.weights] above, unchanged.
#
# Each profile is a complete vector held to the same rules as the default:
# every feature named, non-negative, summing to 1.0.

# A correct plank is horizontal and motionless -- which is precisely what
# `fall` (bbox wider than tall) and `stillness` (centroid not moving) are
# built to treat as an emergency. Measured before this profile existed, a
# textbook plank scored 0.42 against a 0.5 threshold and displayed
# `prolonged_stillness, off_task_orientation` on the trainer's dashboard,
# leaving the actual form signal worth 0.12 -- less than the noise. Off-task
# orientation goes too: the shoulder-line reference angle assumes a standing
# trainee facing their station.
#
# What remains is form, plus occlusion (still meaningful: if the phone cannot
# see the trainee, no plank verdict is trustworthy either).
[scoring.exercise_weights.plank]
fall = 0.0
stillness = 0.0
occlusion = 0.15
off_task = 0.0
form_error = 0.85

# A bicep curl is close to the "standing HIIT" case the default weights were
# written for -- fall and off_task stay meaningful, a trainee actually falling
# or turning away from the station is still worth flagging. `stillness` is the
# one that misreads it: a curl is small-amplitude arm motion around a nearly
# stationary torso, and this feature reads the centroid, not the limb. Rather
# than half-trust that distinction with no footage to check it against, this
# follows the plank profile's pattern exactly -- form_error absorbs
# everything but occlusion. See docs/VALIDATION.md for the threshold
# arithmetic this implies for lean_back_error.
[scoring.exercise_weights.bicep]
fall = 0.0
stillness = 0.0
occlusion = 0.15
off_task = 0.0
form_error = 0.85

# A lunge is a stepping motion, not a hold, so in principle `stillness` and
# `off_task` should be closer to the default than plank's. But `fall` is a
# real risk: a side-on lunge at full depth (front knee bent, both feet planted
# fore-and-aft) plausibly reads as "bbox wider than tall" on a correct rep,
# the same bbox-shape misfire plank's profile exists to fix. With no footage
# to validate a partial profile against, this follows the same
# occlusion-plus-form_error pattern as plank and bicep rather than presenting
# unfounded confidence in which of the other three features survive contact
# with a lunge. See docs/VALIDATION.md.
[scoring.exercise_weights.lunge]
fall = 0.0
stillness = 0.0
occlusion = 0.15
off_task = 0.0
form_error = 0.85


# ---------------------------------------------------------------------------
# WebSocket ingest. One connection per trainee's phone; see docs/PROTOCOL.md
# for the `hello` / `observation` message formats. This replaces local camera
# capture entirely -- the laptop never opens a camera or touches a frame.
# ---------------------------------------------------------------------------
[ingest]
ws_host = "0.0.0.0"           # 0.0.0.0 = reachable from phones on the LAN
ws_port = 8765
protocol_version = 1          # bump alongside docs/PROTOCOL.md; mismatches are rejected
rank_interval_s = 0.5         # how often the merged rank is recomputed and emitted
track_ttl_s = 10.0            # a station silent this long is presumed to have left


# ---------------------------------------------------------------------------
# LAN discovery. The laptop broadcasts where its WebSocket listener is, so a
# phone on the same Wi-Fi can find it instead of someone typing an IP into
# every device -- see docs/PROTOCOL.md, "Discovery".
#
# This is outward-facing, so be clear about what it does: it announces this
# laptop's ws:// address to the local network once a second. It carries no
# trainee data and it advertises a port that ws_host = "0.0.0.0" above has
# already left open, so it publishes the *fact* of the service, not new
# access to it. Turn it off on a network where even that is unwanted; phones
# can still be pointed at the address by hand.
# ---------------------------------------------------------------------------
[discovery]
enabled = true
port = 8766
interval_s = 1.0
broadcast = ""                # blank = 255.255.255.255; set e.g. "192.168.1.255"
                              # on a network that drops limited broadcast


# ---------------------------------------------------------------------------
# The session: whose floor this is, and who is allowed onto it.
#
# `name` is what a phone shows when it finds this laptop, so it should read
# like something an instructor would recognise across a room -- their own
# name, or the class. Blank shows the address instead.
#
# `approval` decides what happens when a phone asks to join:
#
#   "auto"   (default) a well-formed hello is acknowledged immediately, which
#            is exactly how Argus behaved before admission existed.
#   "manual" the connection waits until the instructor approves it on the
#            console, or until join_timeout_s elapses.
#
# Auto is the default because the failure modes are not symmetric: an
# unwanted phone on the console is a nuisance an instructor can see and
# disconnect, whereas a trainee standing at a rack unmonitored because nobody
# noticed a prompt is the thing this system exists to prevent. Use "manual"
# where an open floor means strangers' phones would otherwise appear.
# ---------------------------------------------------------------------------
[session]
name = ""
approval = "auto"             # "auto" or "manual"
join_timeout_s = 120.0        # how long an unanswered join request waits


# ---------------------------------------------------------------------------
# Outputs. Every alert sink here is typed to accept only TriageRecord.
#
# The trainer console at GET / is the one exception, and deliberately a
# narrow one: it also reads the live numeric observation (box, COCO-17
# keypoints, the phone's own exercise/rep/form fields) so it can draw a
# skeleton, which a four-field TriageRecord cannot express. That payload is
# still numbers -- no frame ever existed past the phone's own camera -- and
# it goes only to GET /console on the loopback-bound HTTP server. Nothing
# widened: the JSON log and the alert sinks still carry the same four fields
# they always did. See docs/CONSOLE.md.
# ---------------------------------------------------------------------------
[outputs]
console = true                # stderr alert sink (NOT the trainer console page)
json_log = ""                 # blank = disabled
http_port = 0                 # 0 = disabled; also serves the trainer console
http_host = "127.0.0.1"

# The trainer console page served at GET /.
console_poll_interval_ms = 200  # how often the page re-reads GET /console
# A station silent this long is drawn as stale rather than calm -- the whole
# point of the console being the only place a quiet station and a calm one
# can be told apart. Keep it well under ingest.track_ttl_s above, or a
# station is evicted before it is ever drawn stale; `argus doctor` warns.
console_stale_after_s = 2.0
# Whether POST /join/decide is accepted from machines other than this one.
# Off by default: approving a phone decides who monitors a trainee, and the
# check is on the *requesting* client's address, so serving the console on a
# second screen does not hand that decision to the rest of the LAN.
allow_remote_join_control = false
