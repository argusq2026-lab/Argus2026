# Argus — default configuration.
#
# This file is the single source of tuning truth. Nothing in src/argus/ may
# hardcode a weight, a threshold, a cadence, or a model path: retuning Argus
# is a config edit and a version bump, never a code edit.
#
# `config_version` is checked on load. Bump it whenever a key is renamed,
# removed, or changes meaning, so a stale operator config fails loud instead
# of silently scoring with defaults.

config_version = 1


# ---------------------------------------------------------------------------
# Deterministic triage scorer (src/argus/triage.py)
#
# The five weights below have NOT been validated against real incidents --
# no labelled trainee-floor footage exists yet. They are the prototype's
# hand-set priors. Use `argus tune` (tools/label_harness) to fit them
# empirically before trusting the rank operationally.
# ---------------------------------------------------------------------------
[scoring]
alert_threshold = 0.5
history_len = 30              # frames kept per trainee (~2 s at 15 FPS)
keypoint_conf_threshold = 0.3
stillness_motion_threshold_px = 4.0
# Shoulder-line angle that means "facing the station". 180, not 0: COCO and
# MediaPipe label joints from the SUBJECT's perspective, so a camera-facing
# trainee has their left shoulder at the larger image x and the shoulder-line
# angle reads as 180 degrees. Setting this to 0 makes every attentive trainee
# score a full off-task deviation. Override per-camera under [[cameras]].
off_task_reference_angle_deg = 180.0

[scoring.weights]
fall = 0.40
stillness = 0.20
occlusion = 0.15
off_task = 0.10
vlm_anomaly = 0.15

# Closed vocabulary the VLM caption is matched against. The VLM's free text
# never scores directly -- only whether it contains one of these phrases --
# which is what keeps the rank deterministic despite non-deterministic decoding.
[scoring.anomaly_vocab]
"fall" = 1.0
"fallen" = 1.0
"smoke" = 1.0
"unresponsive" = 1.0
"collision" = 0.9
"no ppe" = 0.8
"no helmet" = 0.8
"unsafe" = 0.7
"no gloves" = 0.6


# ---------------------------------------------------------------------------
# Inference engine
#
# `kind` selects the backend explicitly. There is no automatic degradation:
# if `qnn-npu` cannot put the graph on the Hexagon NPU, Argus raises rather
# than quietly producing CPU-speed results that look like NPU results.
# ---------------------------------------------------------------------------
[engine]
kind = "mock"                 # mock | onnx-cpu | qnn-npu
allow_cpu_fallback = false    # only ever set true for deliberate A/B measurement
cache_dir = ".qnn_cache"      # persistent HTP context cache (first-run compile)

# How to execute a QNN context binary (.bin). onnxruntime-qnn cannot load a
# raw .bin: it must either be wrapped in an EPContext ONNX node, or run by
# the QAIRT SDK's own qnn-net-run.
#   epcontext -> generate an EPContext ONNX wrapper, run in-process via ORT
#   netrun    -> shell out to qnn-net-run.exe from the QAIRT SDK
context_binary_mode = "epcontext"
qairt_sdk_root = ""           # blank = auto-detect (QNN_SDK_ROOT, then C:\Qualcomm\AIStack\QAIRT\qairt\*)

# ONNX Runtime graph optimization: disabled | basic | extended | all.
# NOTE: at `extended` and above, ORT's QDQ fusion raises "two nodes with same
# node name (/model/cnn/0/Conv)" on the shipped QuickSRNet graph. The artifact
# is valid -- onnx.checker passes and its node names are unique -- so this is
# an ORT fusion issue, not a bad export. Argus retries at `basic` and says so;
# numerics are unchanged. Set this to "basic" to skip the retry entirely.
graph_optimization_level = "extended"


# ---------------------------------------------------------------------------
# Model artifacts. Paths are relative to `root`, which is relative to the
# repo root unless absolute. `argus bootstrap` produces this tree.
# ---------------------------------------------------------------------------
[models]
root = "models"
detector = "yolox-onnx-w8a8/yolox.onnx"
detector_metadata = "yolox-onnx-w8a8/metadata.json"
detector_labels = "yolox-onnx-w8a8/labels.txt"
pose_detector = "mediapipe_pose-qnn_context_binary-w8a8-qualcomm_snapdragon_x_elite/pose_detector.bin"
pose_landmark = "mediapipe_pose-qnn_context_binary-w8a8-qualcomm_snapdragon_x_elite/pose_landmark_detector.bin"
pose_metadata = "mediapipe_pose-qnn_context_binary-w8a8-qualcomm_snapdragon_x_elite/metadata.json"
super_res = "quicksrnetmedium-onnx-w8a8/quicksrnetmedium.onnx"
super_res_metadata = "quicksrnetmedium-onnx-w8a8/metadata.json"


# ---------------------------------------------------------------------------
# Detector post-processing (YOLO-X w8a8).
# The graph emits already-decoded boxes/scores/class_idx; NMS is CPU-side.
# ---------------------------------------------------------------------------
[detector]
score_threshold = 0.35
nms_iou_threshold = 0.45
person_class_index = 0        # labels.txt line 1 == "person"
max_detections = 64
letterbox_pad_value = 114     # YOLO-X convention


# ---------------------------------------------------------------------------
# Pose. Two-stage BlazePose: a 128x128 SSD detector locates the person and
# yields an alignment ROI; a 256x256 landmark model produces 25 landmarks.
# ---------------------------------------------------------------------------
[pose]
# NOTE: box_scores_* were calibrated to an entirely non-positive logit range
# (scale 5.55, zero_point 255), so the detector's confidence is effectively
# two-valued: 0.5 at the top quantization step, 0.0039 at the next one down.
# Any threshold in (0.004, 0.5] selects the same anchors. That is a
# placeholder-calibration artefact, not a tuning choice -- see docs/VALIDATION.md.
detector_score_threshold = 0.4
detector_nms_iou_threshold = 0.3
roi_scale = 1.25              # expand the detector ROI before the landmark stage
landmark_presence_threshold = 0.5
detector_scores_are_logits = true
landmark_visibility_is_logit = false
# The landmark model emits 25 BlazePose points; COCO knees/ankles (13-16)
# have no source landmark and are reported at confidence 0.0. See
# src/argus/vision/keypoints.py.


# ---------------------------------------------------------------------------
# Super-resolution. Crops below `min_bbox_area_frac` of the frame are
# upscaled 128 -> 512 before the pose stage so distant trainees survive.
# ---------------------------------------------------------------------------
[super_res]
enabled = true
min_bbox_area_frac = 0.02


# ---------------------------------------------------------------------------
# Tracking / identity.
#
# trainee_id is a triage key: an instructor is alerted about a specific
# person, so an ID swap is a correctness bug, not cosmetic. Motion (Kalman +
# IoU) is combined with a coarse colour-histogram appearance signature so an
# ID survives occlusion instead of churning.
# ---------------------------------------------------------------------------
[tracking]
max_age_frames = 45           # frames a track survives unmatched before deletion
min_hits = 3                  # matches before a track is publishable
iou_match_threshold = 0.2
appearance_weight = 0.35      # 0 = pure motion, 1 = pure appearance
appearance_gate = 0.45        # reject a match whose appearance distance exceeds this
appearance_momentum = 0.9     # EMA on the stored signature
hist_bins = 12                # per-channel HSV histogram bins


# ---------------------------------------------------------------------------
# VLM. Samples only trainees the deterministic score has already flagged --
# this gate is what keeps the VLM off the per-frame latency budget.
# ---------------------------------------------------------------------------
[vlm]
kind = "mock"                 # mock | genie
sample_interval_s = 1.0       # per trainee
top_k = 3                     # hard bound on VLM calls per frame, per camera
prefilter_score_threshold = 0.35   # a trainee is eligible only at/above this triage score
bundle_dir = ""               # Genie bundle produced by scripts/fetch_vlm.py
prompt = "Describe any safety anomaly involving this person in one short phrase."


# ---------------------------------------------------------------------------
# Cameras. The product premise is "many eyes": every source gets its own
# tracker state, and the instructor sees one merged global rank.
# ---------------------------------------------------------------------------
[[cameras]]
id = "cam0"
source = "demo/trainees_demo.mp4"   # int index for a live camera, path for a file
enabled = true
# reference_angle_deg = 0.0         # per-camera override of the station-facing angle


# ---------------------------------------------------------------------------
# Outputs. Every sink here is typed to accept only TriageRecord.
# ---------------------------------------------------------------------------
[outputs]
console = true
json_log = ""                 # blank = disabled
http_port = 0                 # 0 = disabled
http_host = "127.0.0.1"
overlay_window = false        # cv2.imshow; off by default so CI stays headless
overlay_out = ""              # blank = disabled
