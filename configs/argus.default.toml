# Argus — default configuration.
#
# This file is the single source of tuning truth. Nothing in src/argus/ may
# hardcode a weight, a threshold, or a network setting: retuning Argus is a
# config edit and a version bump, never a code edit.
#
# `config_version` is checked on load. Bump it whenever a key is renamed,
# removed, or changes meaning, so a stale operator config fails loud instead
# of silently scoring with defaults.
#
# This same file's [scoring.form_error_vocab] is the closed vocabulary a
# phone's on-device form/exercise classifier must draw its `form_reason_codes`
# from -- see docs/PROTOCOL.md. Phone and laptop are expected to deploy from
# copies of the same config.

config_version = 3


# ---------------------------------------------------------------------------
# Deterministic triage scorer (src/argus/triage.py)
#
# The five weights below have NOT been validated against real incidents --
# no labelled trainee-floor footage exists yet. They are the prototype's
# hand-set priors. See docs/VALIDATION.md before trusting the rank
# operationally.
# ---------------------------------------------------------------------------
[scoring]
alert_threshold = 0.5
history_len = 30              # observations kept per trainee (~2 s at ~15 Hz)
keypoint_conf_threshold = 0.3
# bbox_xyxy / keypoints_xy arrive normalized to [0, 1] of the phone's own
# frame (see docs/PROTOCOL.md); 0.003 is "near-zero motion" as a fraction of
# frame size, not a pixel count.
stillness_motion_threshold_frac = 0.003
# Shoulder-line angle that means "facing the station". 180, not 0: COCO and
# MediaPipe label joints from the SUBJECT's perspective, so a camera-facing
# trainee has their left shoulder at the larger image x and the shoulder-line
# angle reads as 180 degrees. Setting this to 0 makes every attentive trainee
# score a full off-task deviation. Override per-station under [[stations]]
# if a future release adds one; today every station shares this reference.
off_task_reference_angle_deg = 180.0

[scoring.weights]
fall = 0.40
stillness = 0.20
occlusion = 0.15
off_task = 0.10
form_error = 0.15

# Closed vocabulary of form/exercise-classifier codes a phone may report in
# `form_reason_codes`. This is authoritative on both ends: the ingest server
# rejects a connection that reports a code outside this set (see
# `argus.ingest.protocol`), which is what keeps the rank reproducible despite
# the phone-side classifier not being auditable from here.
[scoring.form_error_vocab]
"insufficient_depth" = 0.6
"knee_valgus" = 0.8
"rounded_back" = 0.8
"heels_rising" = 0.5
"excessive_forward_lean" = 0.5
"incomplete_lockout" = 0.4
"asymmetric_form" = 0.6
# Plank, from the phone's on-device classifier (android/.../PlankClassifier.kt).
# Sagging outranks piking because lumbar hyperextension under load is the
# injury mechanism, where piking is merely an ineffective hold.
"hips_sagging" = 0.8
"hips_piked" = 0.6


# Per-exercise weight overrides. A movement can make a feature meaningless or
# actively wrong, and the scorer resolves that by looking up a whole weight
# vector rather than by special-casing exercises in code. A feature weighted 0
# contributes nothing AND emits no reason code. An exercise with no profile
# here scores on [scoring.weights] above, unchanged.
#
# Each profile is a complete vector held to the same rules as the default:
# every feature named, non-negative, summing to 1.0.

# A correct plank is horizontal and motionless -- which is precisely what
# `fall` (bbox wider than tall) and `stillness` (centroid not moving) are
# built to treat as an emergency. Measured before this profile existed, a
# textbook plank scored 0.42 against a 0.5 threshold and displayed
# `prolonged_stillness, off_task_orientation` on the trainer's dashboard,
# leaving the actual form signal worth 0.12 -- less than the noise. Off-task
# orientation goes too: the shoulder-line reference angle assumes a standing
# trainee facing their station.
#
# What remains is form, plus occlusion (still meaningful: if the phone cannot
# see the trainee, no plank verdict is trustworthy either).
[scoring.exercise_weights.plank]
fall = 0.0
stillness = 0.0
occlusion = 0.15
off_task = 0.0
form_error = 0.85


# ---------------------------------------------------------------------------
# WebSocket ingest. One connection per trainee's phone; see docs/PROTOCOL.md
# for the `hello` / `observation` message formats. This replaces local camera
# capture entirely -- the laptop never opens a camera or touches a frame.
# ---------------------------------------------------------------------------
[ingest]
ws_host = "0.0.0.0"           # 0.0.0.0 = reachable from phones on the LAN
ws_port = 8765
protocol_version = 1          # bump alongside docs/PROTOCOL.md; mismatches are rejected
rank_interval_s = 0.5         # how often the merged rank is recomputed and emitted
track_ttl_s = 10.0            # a station silent this long is presumed to have left


# ---------------------------------------------------------------------------
# Outputs. Every sink here is typed to accept only TriageRecord.
# ---------------------------------------------------------------------------
[outputs]
console = true
json_log = ""                 # blank = disabled
http_port = 0                 # 0 = disabled; also serves the trainer dashboard
http_host = "127.0.0.1"
